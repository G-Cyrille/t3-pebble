name: Check and build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run check
      - name: Install Pebble tool and SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y libfdt1 libsdl2-2.0-0 libpixman-1-0
          python -m pip install pebble-tool==5.1.2
          pebble sdk install 4.44
      - run: npm run release
      - uses: actions/upload-artifact@v4
        with:
          name: t3-pebble
          path: |
            build/t3-pebble-v*.pbw
            build/SHA256SUMS
