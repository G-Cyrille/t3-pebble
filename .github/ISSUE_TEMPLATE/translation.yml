name: Translation
description: Propose a new language or improve an existing translation.
body:
  - type: markdown
    attributes:
      value: "Please remove private data. AI assistance is welcome; disclose tools and models below. Security reports belong in SECURITY.md."
  - type: textarea
    id: language
    attributes:
      label: Language
      description: Language name and locale code, such as de or pt-BR.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Translation request
      description: Missing language, wording correction, font problem, or layout problem. Mention keys when known.
    validations:
      required: true
  - type: textarea
    id: review
    attributes:
      label: Speaker and device review
      description: Your familiarity with the language and devices checked. AI translation is welcome with its limitations stated.
    validations:
      required: true
  - type: textarea
    id: ai-writing
    attributes:
      label: AI usage for writing
      description: Agents/tools, model(s), and role in writing or translating this issue. Use None or Unknown / not exposed when appropriate.
    validations:
      required: true
  - type: textarea
    id: ai-implementation
    attributes:
      label: AI usage for investigation or implementation
      description: Agents/tools, model(s), and role in code, investigation, tests, assets, or review. Use None, Not applicable, or Unknown / not exposed.
    validations:
      required: true
